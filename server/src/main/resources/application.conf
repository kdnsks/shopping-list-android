ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ ru.kdnsks.shoppinglist.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5433/shopping_list"
    url = ${?DB_URL}
    user = "shop"
    user = ${?DB_USER}
    password = "shop123"
    password = ${?DB_PASSWORD}
}

jwt {
    # В Docker секрет задаётся переменной окружения JWT_SECRET (файл .env)
    secret = "dev-only-secret-change-me"
    secret = ${?JWT_SECRET}
    issuer = "shopping-list-server"
    audience = "shopping-list-app"
    realm = "shopping-list"
    ttlHours = 24
}
